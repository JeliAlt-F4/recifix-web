<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f2">
    <title>Recifix Admin - Members</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/api.js" defer></script>
    <script src="js/admin.js" defer></script>
</head>
<body>
    <div class="admin-shell">
        <aside class="sidebar">
            <a class="brand" href="admin.html" aria-label="Recifix admin home">
                <span class="brand-mark"><img src="images/icons/leave-logo-dashboard.svg" alt=""></span>
                <span class="brand-copy"><strong>Recifix</strong><small>ADMIN CONSOLE</small></span>
            </a>
            <div class="workspace-label">WORKSPACE</div>
            <nav class="side-nav" aria-label="Admin navigation">
                <a class="side-link" href="admin.html"><span class="nav-icon" aria-hidden="true">⌂</span>Overview</a>
                <a class="side-link active" href="admin-members.html"><span class="nav-icon" aria-hidden="true">♙</span>Members<span class="nav-count">...</span></a>
                <a class="side-link" href="admin-messages.html"><span class="nav-icon" aria-hidden="true">✉</span>Messages<span class="nav-dot" aria-label="Unread messages" hidden></span></a>
                <a class="side-link" href="admin-recipes.html"><span class="nav-icon" aria-hidden="true">▤</span>Recipes</a>
                <a class="side-link" href="admin-settings.html"><span class="nav-icon" aria-hidden="true">⚙</span>Account Settings</a>
            </nav>
            <div class="sidebar-bottom">
                <div class="sidebar-admin">
                    <span class="avatar avatar-small" id="adminAvatar">A</span>
                    <span><strong id="adminName">Admin</strong><small id="adminRole">Administrator</small></span>
                    <span class="online-dot" aria-label="Online"></span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong>Members</strong></div>
                <div class="topbar-actions">
                    <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
                        <span aria-hidden="true"><img src="images/icons/lightmode.svg" alt=""></span>
                    </button>
                    <div class="account-wrap" aria-label="Administrator account">
                        <div class="account-button">
                            <span class="avatar">A</span>
                            <span class="account-copy"><strong id="topAdminName">Admin</strong><small>Admin</small></span>
                            <span class="chevron" aria-hidden="true"></span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <section class="content-panel members-panel">
                    <div class="panel-heading">
                        <div><p class="section-kicker">YOUR COMMUNITY</p><h2>Registered members</h2><p class="panel-description">The people making Recifix feel like home.</p></div>
                        <label class="search-box member-search"><span aria-hidden="true">⌕</span><span class="sr-only">Search members by name or email</span><input id="memberSearch" type="search" placeholder="Search name or email..." autocomplete="off"></label>
                    </div>
                    <div class="member-filters" role="group" aria-label="Filter members by role">
                        <button class="member-filter active" type="button" data-member-filter="all" aria-pressed="true">All <span data-filter-count="all">0</span></button>
                        <button class="member-filter" type="button" data-member-filter="member" aria-pressed="false">Members <span data-filter-count="member">0</span></button>
                        <button class="member-filter" type="button" data-member-filter="mod" aria-pressed="false">Mods <span data-filter-count="mod">0</span></button>
                        <button class="member-filter" type="button" data-member-filter="admin" aria-pressed="false">Admin <span data-filter-count="admin">0</span></button>
                    </div>
                    <div class="table-wrap">
                        <table class="members-table">
                            <thead><tr><th>MEMBER</th><th>EMAIL ADDRESS</th><th>ROLE</th><th>JOINED</th><th>STATUS</th></tr></thead>
                            <tbody id="membersTableBody"></tbody>
                        </table>
                    </div>
                    <div class="panel-footer member-panel-footer"><span id="memberCountLabel"></span><nav class="pagination-controls" aria-label="Member pages"><button type="button" id="memberPreviousPage" aria-label="Previous page">Previous</button><span id="memberPageLabel"></span><button type="button" id="memberNextPage" aria-label="Next page">Next</button></nav></div>
                </section>
            </div>
        </main>
    </div>

    <dialog id="adminAccountModal" class="account-modal" aria-labelledby="adminAccountName" hidden>
        <div class="account-modal-content">
            <button type="button" class="account-modal-close" data-close-account aria-label="Close account menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="account-modal-header">
                <div class="account-avatar" id="adminAccountAvatar">A</div>
                <div class="account-info">
                    <h3 id="adminAccountName">Admin</h3>
                    <p id="adminAccountEmail">admin@recifix.com</p>
                </div>
            </div>
            <div class="account-modal-body">
                <button type="button" class="account-modal-item" id="adminAccountChangePassword">
                    <span class="account-modal-label">Change password</span>
                    <span class="account-modal-sublabel">Update your account password</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 17 16 12 9 7"></polyline>
                    </svg>
                </button>
                <button type="button" class="account-modal-item logout-item" id="adminAccountLogout">
                    <span class="account-modal-label">Log out</span>
                    <span class="account-modal-sublabel">Sign out of your account</span>
                </button>
            </div>
        </div>
    </dialog>
</body>
</html>
